<!DOCTYPE html>
<html>

<head>

<title>Hotel NSP - Login / Sign Up</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- Header -->

<header>

<div class="logo">

<img src="images/logo.png"
     alt="Hotel Logo"
     width="50"
     height="50">

<h1>Hotel NSP</h1>

</div>


<nav>

<a href="index.html">
Home
</a>

<a href="index.html#rooms">
Rooms
</a>

</nav>

</header>



<!-- Login / Signup -->

<section class="auth">


<!-- Login -->

<div class="auth-box"
     id="loginBox">

<h2>Login</h2>

<p>
Login to continue booking your room.
</p>


<form id="loginForm">


<input
type="text"
name="uname"
placeholder="Username"
required>


<input
type="password"
name="pwd"
placeholder="Password"
required>


<button type="submit">
Login
</button>


</form>


<p id="loginResult"></p>


<p>

New user?

<a href="#"
   onclick="showSignup()">

Create an account

</a>

</p>

</div>



<!-- Signup -->

<div class="auth-box"
     id="signupBox"
     style="display:none;">

<h2>Create Account</h2>

<p>
Register to book your hotel room.
</p>


<form id="signupForm">


<input
type="text"
name="fname"
placeholder="First Name"
required>


<input
type="text"
name="lname"
placeholder="Last Name"
required>


<input
type="text"
name="uname"
placeholder="Username"
required>


<input
type="date"
name="dob"
required>


<input
type="password"
name="pwd"
placeholder="Password"
required>


<input
type="text"
name="mobile"
placeholder="Mobile Number"
maxlength="10"
required>


<input
type="text"
name="postal"
placeholder="Postal Code"
maxlength="6"
required>


<input
type="email"
name="email"
placeholder="Email"
required>


<button type="submit">

Sign Up

</button>


</form>


<p id="signupResult"></p>


<p>

Already have an account?

<a href="#"
   onclick="showLogin()">

Login

</a>

</p>


</div>

</section>



<!-- Footer -->

<footer>

<p>
&copy; 2026 Hotel NSP
</p>

</footer>



<script src="script.js"></script>

</body>

</html>
