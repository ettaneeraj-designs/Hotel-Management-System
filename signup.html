
<!DOCTYPE html>
<html>
<head>
<title>Hotel NSP - Login / Sign Up</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">
        <img src="images/logo.png" alt="Hotel Logo" width="50" height="50">
        <h1>Hotel NSP</h1>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#rooms">Rooms</a>
    </nav>
</header>

<section class="auth">

    <div class="auth-box" id="loginBox">
        <h2>Login</h2>
        <p>Login to continue booking your room.</p>

        <form id="loginForm">
            <input type="text" name="uname" placeholder="Username" required>
            <input type="password" name="pwd" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <p id="loginResult"></p>
        <p>New user? <a href="#" onclick="showSignup(); return false;">Create an account</a></p>
    </div>

    <div class="auth-box" id="signupBox" style="display:none;">

        <h2>Create Account</h2>
        <p>Register to book your hotel room.</p>

        <form id="signupForm" novalidate>

            <input type="text" name="fname" placeholder="First Name"
                   onblur="checkField(this)" required>
            <span id="fmsg"></span>

            <input type="text" name="lname" placeholder="Last Name"
                   onblur="checkField(this)" required>
            <span id="lmsg"></span>

            <input type="text" name="uname" placeholder="Username"
                   onblur="checkField(this)" required>
            <span id="umsg"></span>

            <input type="date" name="dob" title="Date of Birth"
                   onblur="checkField(this)" required>
            <span id="dmsg"></span>

            <input type="password" name="pwd" placeholder="Password"
                   onblur="checkField(this)" required>
            <span id="pmsg"></span>

            <input type="text" name="mobile" placeholder="Mobile Number"
                   maxlength="10" onblur="checkField(this)" required>
            <span id="mmsg"></span>

            <input type="text" name="postal" placeholder="Postal Code"
                   maxlength="6" onblur="checkField(this)" required>
            <span id="pcmsg"></span>

            <input type="email" name="email" placeholder="Email ID"
                   onblur="checkField(this)" required>
            <span id="emsg"></span>

            <button type="submit">Sign Up</button>
            <input type="reset" value="Reset">

        </form>

        <p id="signupResult"></p>
        <p>Already have an account?
            <a href="#" onclick="showLogin(); return false;">Login</a>
        </p>

    </div>

</section>

<footer>
    <p>&copy; 2026 Hotel NSP</p>
</footer>

<script>
function checkField(field) {
    let rules = {
        fname: [/^[A-Za-z]{3,}$/, "Invalid First Name"],
        lname: [/^[A-Za-z]{3,}$/, "Invalid Last Name"],
        uname: [/^[A-Za-z0-9_]{5,}$/, "Invalid Username"],
        dob: [/^\d{4}-\d{2}-\d{2}$/, "Select DOB"],
        pwd: [/^(?=.*[A-Z])(?=.*\W).{8,}$/, "Invalid Password"],
        mobile: [/^[6-9][0-9]{9}$/, "Invalid Mobile"],
        postal: [/^[0-9]{6}$/, "Invalid Postal Code"],
        email: [/^[^\s@]+@[^\s@]+\.[^\s@]+$/, "Invalid Email"]
    };

    let rule = rules[field.name];
    let message = document.getElementById({
        fname: "fmsg", lname: "lmsg", uname: "umsg",
        dob: "dmsg", pwd: "pmsg", mobile: "mmsg",
        postal: "pcmsg", email: "emsg"
    }[field.name]);

    if (!field.value.trim() || !rule[0].test(field.value)) {
        message.textContent = rule[1];
        return false;
    }

    message.textContent = "";
    return true;
}

document.getElementById("signupForm").addEventListener(
    "submit",
    function(event) {
        let valid = true;

        this.querySelectorAll("input[name]").forEach(function(field) {
            if (!checkField(field)) {
                valid = false;
            }
        });

        if (!valid) {
            event.preventDefault();
            event.stopImmediatePropagation();
            alert("Please Enter Valid Details");
        }
    },
    true
);
</script>

<script src="script.js"></script>

</body>
</html>
